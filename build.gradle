
plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-" + project.minecraft_version
}

repositories {
    mavenCentral()
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Gegy"
        url = "https://maven.gegy.dev"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    modImplementation "net.caffeinemc:sodium-fabric:${project.sodium_version}"

    //LDL compat
    modCompileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}"

    //voxy compat
    // TODO: put the Voxy 1.21.1 backport jar (0.2.x) into libs/ (it is not on Modrinth's maven); change the name if needed
    modCompileOnly files("libs/voxy-1.21.1.jar")

    //dh compat
    modCompileOnly "maven.modrinth:uCdwusMi:9w34y8ai" // Distant Horizons 3.3.3 for 1.21.1

    //nvidium compat
    modCompileOnly "maven.modrinth:SfMw2IZN:BIQFSOIx" // Nvidium 0.4.1-beta10 for 1.21.1
}

processResources {
    def version = project.version
    inputs.property "version", version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "sodium_version", project.sodium_version
    inputs.property "fabric_version", project.fabric_version

    filesMatching("fabric.mod.json") {
        expand "version": version,
        "minecraft_version": project.minecraft_version,
        "loader_version": project.loader_version,
        "sodium_version": project.sodium_version,
        "fabric_version": project.fabric_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}